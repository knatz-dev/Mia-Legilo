<script>
    let currentDirection = 'desc';
    let selectedCriteria = 'last_read';

    function setDirection(dir) {
      currentDirection = dir;
      const ascBtn = document.getElementById('dir-asc');
      const descBtn = document.getElementById('dir-desc');

      if (dir === 'asc') {
        ascBtn.className = "flex-1 min-h-[46px] px-2.5 py-1.5 rounded-lg flex items-center justify-center space-x-1.5 bg-paper-surface text-ink-charcoal shadow-[1.5px_1.5px_0px_#292724] transition-all";
        ascBtn.innerHTML = '<span class="material-symbols-outlined text-[17px] text-ochre-accent">north</span><span class="font-label-md text-label-md font-semibold leading-tight text-center">Ascending <span class="text-ink-muted text-[10px] block">A→Z • Oldest</span></span>';
        
        descBtn.className = "flex-1 min-h-[46px] px-2.5 py-1.5 rounded-lg flex items-center justify-center space-x-1.5 transition-all text-on-surface-variant hover:text-ink-charcoal";
        descBtn.innerHTML = '<span class="material-symbols-outlined text-[17px]">south</span><span class="font-label-md text-label-md leading-tight text-center">Descending <span class="opacity-60 text-[10px] block">Z→A • Newest</span></span>';
      } else {
        descBtn.className = "flex-1 min-h-[46px] px-2.5 py-1.5 rounded-lg flex items-center justify-center space-x-1.5 bg-paper-surface text-ink-charcoal shadow-[1.5px_1.5px_0px_#292724] transition-all";
        descBtn.innerHTML = '<span class="material-symbols-outlined text-[17px] text-ochre-accent">south</span><span class="font-label-md text-label-md font-semibold leading-tight text-center">Descending <span class="text-ink-muted text-[10px] block">Z→A • Newest</span></span>';
        
        ascBtn.className = "flex-1 min-h-[46px] px-2.5 py-1.5 rounded-lg flex items-center justify-center space-x-1.5 transition-all text-on-surface-variant hover:text-ink-charcoal";
        ascBtn.innerHTML = '<span class="material-symbols-outlined text-[17px]">north</span><span class="font-label-md text-label-md leading-tight text-center">Ascending <span class="opacity-60 text-[10px] block">A→Z • Oldest</span></span>';
      }
    }

    function selectCriteria(criteriaId) {
      selectedCriteria = criteriaId;
      const options = document.querySelectorAll('.sort-option');
      options.forEach(opt => {
        const indicator = opt.querySelector('.radio-indicator');
        const icon = opt.querySelector('.material-symbols-outlined');
        const title = opt.querySelector('.font-body-md');
        
        opt.classList.remove('bg-paper-container', 'shadow-[1.5px_1.5px_0px_#292724]');
        opt.classList.add('hover:bg-paper-container/70');
        if (title) title.classList.remove('font-semibold');
        if (icon) icon.classList.remove('text-ochre-accent');
        if (indicator) indicator.innerHTML = '<div class="w-2.5 h-2.5 rounded-full bg-transparent"></div>';
      });

      const eventTarget = window.event ? window.event.currentTarget : null;
      if (eventTarget) {
        eventTarget.classList.add('bg-paper-container', 'shadow-[1.5px_1.5px_0px_#292724]');
        eventTarget.classList.remove('hover:bg-paper-container/70');
        const activeTitle = eventTarget.querySelector('.font-body-md');
        const activeIcon = eventTarget.querySelector('.material-symbols-outlined');
        const activeIndicator = eventTarget.querySelector('.radio-indicator');
        if (activeTitle) activeTitle.classList.add('font-semibold');
        if (activeIcon) activeIcon.classList.add('text-ochre-accent');
        if (activeIndicator) activeIndicator.innerHTML = '<div class="w-3 h-3 rounded-full bg-ink-charcoal shadow-inner"></div>';
      }
    }

    function resetSorting() {
      setDirection('desc');
      const defaultOption = document.getElementById('opt-last-read');
      if (defaultOption) {
        defaultOption.click();
      }
    }

    function applySorting() {
      const applyBtn = document.getElementById('apply-btn');
      if (applyBtn) {
        applyBtn.classList.add('translate-x-[1px]', 'translate-y-[1px]', 'shadow-none');
        setTimeout(() => {
          applyBtn.classList.remove('translate-x-[1px]', 'translate-y-[1px]', 'shadow-none');
          handleDismiss();
        }, 140);
      }
    }

    function handleDismiss() {
      const sheet = document.getElementById('sort-bottom-sheet');
      if (sheet) {
        sheet.style.transform = 'translateY(100%)';
        setTimeout(() => {
          sheet.style.transform = 'translateY(0)';
        }, 800);
      }
    }
  </script>
</div></main></body></html>

name: reader_lab
description: Experimental EPUB engine benchmark for Mia Legilo. Not the production app.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  benchmark_core:
    path: packages/benchmark_core
  epub_rtl: 0.1.0
  flutter_epub_viewer: 2.2.1
  flutter_inappwebview: 6.2.0-beta.3
  file_selector: 1.0.4
  path_provider: 2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/test_books/
    - assets/foliate/
    - assets/foliate/vendor/
